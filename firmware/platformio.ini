; newsroom-tablet – Firmware für das Waveshare ESP32-S3-Touch-LCD-7
;
; Bauen:   ~/.platformio/penv/bin/pio run -d firmware
; Flashen: ~/.platformio/penv/bin/pio run -d firmware -t upload
; Monitor: ~/.platformio/penv/bin/pio device monitor -b 115200
;
; Alle Versionen sind fest gepinnt (claude.md §4). Bibliotheken werden direkt
; von den offiziellen Espressif-Repositories per Git-Tag geholt – so ist
; nachvollziehbar, welcher Code eingebunden wird, und es kann kein fremdes
; Paket mit ähnlichem Namen dazwischenrutschen ("Slopsquatting").

[env:waveshare_s3_touch_lcd_7]
; Die Arduino-Core-3.x-Plattform ("pioarduino") liegt nicht in der
; PlatformIO-Registry, sondern wird als festes Release eingebunden.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
board = esp32-s3-devkitc-1
; Arduino ALS ESP-IDF-Komponente bauen, nicht aus vorgefertigten Bibliotheken.
;
; Der Unterschied ist der Grund, warum das Bild unruhig war: Nur so lassen sich
; die Systemeinstellungen in sdkconfig.defaults setzen - vor allem
; CONFIG_SPIRAM_FETCH_INSTRUCTIONS und CONFIG_SPIRAM_RODATA, die den Flash aus
; dem laufenden Betrieb heraushalten. Die gesicherte Werksfirmware (ESPHome auf
; ESP-IDF 5.5.1) macht genau das und laeuft ruhig.
;
; Preis: Die erste Uebersetzung dauert lange (das komplette ESP-IDF wird
; gebaut), spaetere sind wieder normal schnell.
framework = arduino, espidf

; Erzeugt vor dem Uebersetzen die eingebetteten Zertifikatsdateien der
; Espressif-Zusatzkomponenten (siehe scripts/generate_embeds.py).
extra_scripts = pre:scripts/generate_embeds.py

; --- Speicher des verbauten Moduls ESP32-S3-WROOM-1 N16R8 --------------------
; 16 MB Flash (QIO) und 8 MB PSRAM (OPI). Ohne "qio_opi" startet das Board mit
; abgeschaltetem PSRAM – und ohne PSRAM passt der Bildspeicher des
; 800x480-Panels nicht in den Arbeitsspeicher.
board_build.flash_mode = qio
; "qio_opi" = Flash im QIO-Modus, PSRAM im Octal-Modus. Ohne diese Zeile
; sucht der Start-Code ein Quad-PSRAM, findet keines und meldet
; "PSRAM chip is not connected" – dann fehlt der Speicher fuer den
; Bildpuffer des 800x480-Panels (am Geraet ueberprueft).
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

build_flags =
    ; Die Konfigurationsdateien in include/ muessen auch beim Uebersetzen der
    ; Bibliotheken gefunden werden (lv_conf.h, esp_panel_*_conf.h).
    -Iinclude
    -DBOARD_HAS_PSRAM
    ; LVGL sucht seine Konfiguration als "lv_conf.h" im Include-Pfad
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    ; Das Board hat zwei Anschluesse: die native USB-C-Buchse des ESP32-S3 und
    ; einen CH343-Wandler (meldet sich als /dev/ttyACM0). Mit CDC_ON_BOOT=1
    ; ginge "Serial" auf die native Buchse, waehrend die Systemmeldungen ueber
    ; UART0/CH343 laufen - man saehe nur die Haelfte. Mit 0 schreibt Serial auf
    ; UART0, also auf denselben Anschluss wie die Systemmeldungen.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    ; C++-Standard der Panel-Bibliothek
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#v1.0.4
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.1
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.3
    lvgl/lvgl@8.4.0
    ; JSON-Parser fuer die Antworten von newsroom21
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Der CH343-Wandler des Boards meldet sich als /dev/ttyACM0. Steht das Gerät
; woanders, hier anpassen oder beim Aufruf --upload-port angeben.
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; 921600 hat beim Auslesen des Flash Übertragungsfehler erzeugt, 460800 lief
; über die vollen 16 MB stabil.
upload_speed = 460800


; ---------------------------------------------------------------------------
; Testfirmware: nur das Panel, kein WLAN, kein LVGL (src/paneltest.cpp).
; Dient dazu, Flimmern und Bilddrift eindeutig zuzuordnen.
;
;   Flashen:  pio run -d firmware -e paneltest -t upload
;   Zurueck:  pio run -d firmware -t upload
; ---------------------------------------------------------------------------
[env:paneltest]
extends = env:waveshare_s3_touch_lcd_7
; Der Test braucht WLAN, Einstellungen und den HTTPS-Client - aber weder die
; Oberflaeche (ui*) noch LVGL, denn genau die sollen ausgeschlossen werden.
build_src_filter = -<*> +<paneltest.cpp> +<wifi_manager.cpp> +<settings_store.cpp> +<api_client.cpp>
; Pixeltakt fuer den Test. Ein zu hoher Takt zeigt sich als falsch
; uebernommene Farbbits (z. B. ein blauer Strich in einer weissen Flaeche).
build_flags = ${env:waveshare_s3_touch_lcd_7.build_flags} -DPANEL_PCLK_MHZ=16 -DPANEL_RESTART_EACH_FRAME=0 -DPANEL_BOUNCE_LINES=60
